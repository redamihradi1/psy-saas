{% extends 'base.html' %}
{% load static %}

{% block title %}Nouveau bilan{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-lg p-4 sm:p-8 max-w-2xl mx-auto">
    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mb-6">
        <i class="fas fa-file-signature text-primary mr-2"></i>Nouveau bilan
    </h2>
    <form method="get" action="{% url 'bilans:nouveau' %}" class="space-y-6">
        <div>
            <label for="patient" class="block text-sm font-semibold text-gray-700 mb-2">
                <i class="fas fa-user mr-1 text-primary"></i>Patient *
            </label>
            <select name="patient" id="patient" required data-searchable="1" data-placeholder="Rechercher un patient..."
                    data-recent-ids="{% for p in derniers_patients %}{{ p.id }}{% if not forloop.last %},{% endif %}{% endfor %}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="">-- Choisir un patient --</option>
                {% for p in patients %}
                <option value="{{ p.id }}">{{ p.nom }} {{ p.prenom }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="flex-1 sm:flex-none bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-lg font-semibold transition">
                Continuer <i class="fas fa-arrow-right ml-2"></i>
            </button>
            <a href="{% url 'bilans:liste' %}" class="flex-1 sm:flex-none text-center bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold transition">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/searchable-select.js' %}"></script>
{% endblock %}

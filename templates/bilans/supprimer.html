{% extends 'base.html' %}

{% block title %}Supprimer le bilan{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-lg p-4 sm:p-8 max-w-xl mx-auto">
    <h2 class="text-xl font-bold text-gray-900 mb-4"><i class="fas fa-trash text-red-500 mr-2"></i>Supprimer le bilan</h2>
    <p class="text-gray-700">
        Supprimer définitivement « {{ bilan.titre }} » de {{ bilan.patient.nom_complet }}
        (avec son historique de versions et de chat) ?
    </p>
    <form method="post" class="flex gap-3 mt-6">
        {% csrf_token %}
        <button type="submit" class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold transition">Supprimer</button>
        <a href="{% url 'bilans:editeur' bilan.id %}" class="flex-1 sm:flex-none text-center bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold transition">Annuler</a>
    </form>
</div>
{% endblock %}

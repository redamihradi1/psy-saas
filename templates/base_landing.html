<!DOCTYPE html>
{% load static %}
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{% block title %}PsySaaS{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Palette « Bleu Majorelle & safran » (voir base.html)
              primary: { DEFAULT: "#2A45DE", light: "#EEF3FF", dark: "#2236B8" },
              brand: {
                50: "#EEF3FF", 100: "#DDE6FF", 200: "#C0D0FF", 300: "#93ACFF", 400: "#6180FA",
                500: "#3D5CF2", 600: "#2A45DE", 700: "#2236B8", 800: "#213193", 900: "#1F2D72",
              },
              encre: "#121A33",
              pierre: "#F4F6FB",
              ocre: { DEFAULT: "#F2A81D", light: "#FFF8E6", dark: "#A86A08" },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-white">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-100">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center text-white shadow">
            <i class="fas fa-brain text-sm"></i>
          </div>
          <span class="font-bold text-gray-900 text-lg">PsySaaS</span>
        </div>
        <a href="{% url 'accounts:login' %}"
           class="bg-primary-dark hover:bg-primary text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
            Se connecter
        </a>
      </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="bg-gray-900 text-gray-400 py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
            <div class="flex items-center gap-2 text-white">
                <div class="w-6 h-6 bg-primary rounded flex items-center justify-center">
                    <i class="fas fa-brain text-xs"></i>
                </div>
                <span class="font-semibold">PsySaaS</span>
            </div>
            <p>© {% now "Y" %} PsySaaS — Plateforme de gestion pour psychologues indépendants.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>

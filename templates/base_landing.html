<!DOCTYPE html>
{% load static %}
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{% block title %}PsySaaS{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#e879f9",
              "primary-light": "#fdf4ff",
              "primary-dark": "#c026d3",
            },
          },
        },
      };
    </script>
    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-white">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-100">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center text-white shadow">
            <i class="fas fa-brain text-sm"></i>
          </div>
          <span class="font-bold text-gray-900 text-lg">PsySaaS</span>
        </div>
        <a href="{% url 'accounts:login' %}"
           class="bg-primary-dark hover:bg-primary text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
            Se connecter
        </a>
      </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="bg-gray-900 text-gray-400 py-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm">
            <div class="flex items-center gap-2 text-white">
                <div class="w-6 h-6 bg-gradient-to-br from-primary to-primary-dark rounded flex items-center justify-center">
                    <i class="fas fa-brain text-xs"></i>
                </div>
                <span class="font-semibold">PsySaaS</span>
            </div>
            <p>© {% now "Y" %} PsySaaS — Plateforme de gestion pour psychologues indépendants.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
  </body>
</html>

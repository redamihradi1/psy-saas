{% extends 'base.html' %}

{% block title %}Supprimer le modèle - PsySaaS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-10">
    <h2 class="text-lg font-semibold text-gray-800 mb-2">Supprimer ce modèle ?</h2>
    <p class="text-gray-600 mb-6">« {{ template.nom }} » sera définitivement supprimé.</p>
    <form method="POST" class="flex gap-3">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition">
            <i class="fas fa-trash mr-2"></i>Supprimer
        </button>
        <a href="{% url 'cabinet:message_templates_list' %}" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">
            Annuler
        </a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}{{ title }} - PsySaaS{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="flex items-center mb-6">
        <a href="{% url 'cabinet:message_templates_list' %}" class="text-gray-500 hover:text-primary mr-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
    </div>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nom du modèle</label>
            <input type="text" name="nom" required value="{{ template.nom|default:'' }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type de rappel</label>
            <select name="type_rappel" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                {% for value, label in type_choices %}
                <option value="{{ value }}" {% if template.type_rappel == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contenu du message</label>
            <textarea name="contenu" rows="5" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">{{ template.contenu|default:'' }}</textarea>
            <p class="text-xs text-gray-500 mt-1">
                Variables : <code>{patient}</code>, <code>{date}</code>, <code>{heure}</code>,
                <code>{psychologue}</code>, <code>{lieu}</code>
            </p>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-primary hover:bg-primary-dark text-white px-6 py-2 rounded-lg transition">
                <i class="fas fa-save mr-2"></i>Enregistrer
            </button>
            <a href="{% url 'cabinet:message_templates_list' %}" class="px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">
                Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}

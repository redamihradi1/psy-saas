{% extends 'base.html' %}

{% block title %}Supprimer la dépense - PsySaaS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mt-10">
    <h2 class="text-lg font-semibold text-gray-800 mb-2">Supprimer cette dépense ?</h2>
    <p class="text-gray-600 mb-6">
        {{ depense.get_categorie_display }} — {{ depense.montant }} DHS ({{ depense.date_depense|date:"d/m/Y" }})
    </p>
    <form method="POST" class="flex gap-3">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition">
            <i class="fas fa-trash mr-2"></i>Supprimer
        </button>
        <a href="{% url 'cabinet:comptabilite_dashboard' %}" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">
            Annuler
        </a>
    </form>
</div>
{% endblock %}

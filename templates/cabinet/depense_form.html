{% extends 'base.html' %}

{% block title %}Modifier la dépense - PsySaaS{% endblock %}

{% block content %}
<div class="max-w-md">
    <div class="flex items-center mb-6">
        <a href="{% url 'cabinet:comptabilite_dashboard' %}" class="text-gray-500 hover:text-primary mr-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-2xl font-bold text-gray-800">Modifier la dépense</h1>
    </div>

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
            <select name="categorie" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                {% for value, label in categories %}
                <option value="{{ value }}" {% if depense.categorie == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Montant (DHS)</label>
            <input type="number" step="0.01" name="montant" required value="{{ depense.montant }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
            <input type="date" name="date_depense" required value="{{ depense.date_depense|date:'Y-m-d' }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <input type="text" name="description" value="{{ depense.description }}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-primary hover:bg-primary-dark text-white px-6 py-2 rounded-lg transition">
                <i class="fas fa-save mr-2"></i>Enregistrer
            </button>
            <a href="{% url 'cabinet:comptabilite_dashboard' %}" class="px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">
                Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}

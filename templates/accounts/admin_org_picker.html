{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page_title }} - PsySaaS{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 max-w-xl mx-auto text-center">
    <div class="w-16 h-16 bg-primary-light rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="{{ page_icon }} text-primary-dark text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">{{ page_title }}</h1>
    <p class="text-gray-500 mb-6">Choisissez un cabinet pour afficher ses données.</p>

    <select id="org-picker" data-searchable="1" data-placeholder="Rechercher un cabinet..."
            onchange="if(this.value) window.location.href = '?org=' + this.value"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
        <option value="">Sélectionnez un cabinet</option>
        {% for org in organizations %}
        <option value="{{ org.id }}">{{ org.name }}</option>
        {% endfor %}
    </select>
</div>

<script src="{% static 'js/searchable-select.js' %}"></script>
{% endblock %}
